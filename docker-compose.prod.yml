services:
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/delayrace/}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: production
    environment:
      PORT: 3001
      DATABASE_PATH: /data/trainbet.sqlite
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      TRANSIT_REQUEST_DELAY_MS: ${TRANSIT_REQUEST_DELAY_MS:-500}
      TRANSIT_MAX_RETRIES: ${TRANSIT_MAX_RETRIES:-3}
      GAME_ADMIN_TOKEN: ${GAME_ADMIN_TOKEN:?GAME_ADMIN_TOKEN is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MOTIS_BASE_URL: ${MOTIS_BASE_URL:-https://api.transitous.org}
      TRANSIT_PROVIDER: ${TRANSIT_PROVIDER:-motis}
      INT_BAHN_BASE_URL: ${INT_BAHN_BASE_URL:-https://int.bahn.de}
      HISTORY_SERVICE_BASE_URL: ${HISTORY_SERVICE_BASE_URL:-http://host.docker.internal:8000}
      HISTORY_SERVICE_TIMEOUT_MS: ${HISTORY_SERVICE_TIMEOUT_MS:-2000}
      HISTORY_SERVICE_CACHE_TTL_SECONDS: ${HISTORY_SERVICE_CACHE_TTL_SECONDS:-300}
      EVENT_TIMEZONE: ${EVENT_TIMEZONE:-Europe/Berlin}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: ./deploy/nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.5.0}
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./deploy/observability/loki-config.yml:/etc/loki/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.10.2}
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./deploy/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:12345/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.1.1}
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://fcody.de/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlite_data:
  certbot_www:
  letsencrypt:
  loki_data:
  alloy_data:
  grafana_data:
