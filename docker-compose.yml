services:
  frontend:
    build:
      context: ./frontend
      target: development
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: development
    working_dir: /app
    command: npm run dev
    environment:
      PORT: 3001
      DATABASE_PATH: /data/trainbet.sqlite
      CACHE_TTL_SECONDS: 60
      TRANSIT_REQUEST_DELAY_MS: ${TRANSIT_REQUEST_DELAY_MS:-500}
      TRANSIT_MAX_RETRIES: ${TRANSIT_MAX_RETRIES:-3}
      GAME_ADMIN_TOKEN: ${GAME_ADMIN_TOKEN:-development-admin-token}
      # Local Proxyman debugging only; never enable this in production.
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      SESSION_SECRET: ${SESSION_SECRET:-development-session-secret}
      MOTIS_BASE_URL: ${MOTIS_BASE_URL:-https://api.transitous.org}
      TRANSIT_PROVIDER: ${TRANSIT_PROVIDER:-motis}
      INT_BAHN_BASE_URL: ${INT_BAHN_BASE_URL:-https://int.bahn.de}
      HISTORY_SERVICE_BASE_URL: ${HISTORY_SERVICE_BASE_URL:-http://host.docker.internal:8000}
      HISTORY_SERVICE_TIMEOUT_MS: ${HISTORY_SERVICE_TIMEOUT_MS:-2000}
      HISTORY_SERVICE_CACHE_TTL_SECONDS: ${HISTORY_SERVICE_CACHE_TTL_SECONDS:-300}
      EVENT_TIMEZONE: Europe/Berlin
      MAP_MIN: ${MAP_MIN:-52.0,10.0}
      MAP_MAX: ${MAP_MAX:-52.8,11.0}
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  backend_node_modules:
  sqlite_data:
